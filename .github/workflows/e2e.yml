name: E2E Validation

# Run on-demand (manual) and on a scheduled nightly job to avoid heavy runs on every PR.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --with dev

      - name: Run full E2E target
        run: make e2e
