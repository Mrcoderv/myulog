---
name: Build and Package Artifacts

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-package:
        name: Build and Upload Artifacts
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout (full history for SOURCE_DATE_EPOCH)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Display build context
              run: |
                  echo "Branch: ${{ github.ref_name }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "Event:  ${{ github.event_name }}"
                  git log -1 --format="%H %ai"

            - name: Build artifacts
              run: ./scripts/build.sh

            - name: Verify checksums
              run: ./scripts/verify_checksums.sh

            - name: Show artifacts
              run: |
                  echo "=== dist/ ==="
                  ls -lh dist/
                  echo "=== SHA256SUMS ==="
                  cat dist/SHA256SUMS

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ulog-artifacts-${{ github.sha }}
                  path: |
                      dist/*.whl
                      dist/*.tar.gz
                      dist/*.zip
                      dist/SHA256SUMS
                  retention-days: 90
                  if-no-files-found: error

    verify-reproducibility:
        name: Verify Build Reproducibility
        runs-on: ubuntu-latest
        needs: build-and-package
        permissions:
            contents: read
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Verify reproducible builds
              run: ./scripts/verify_reproducible_build.sh

            - name: Display verified checksums
              run: cat dist/SHA256SUMS
