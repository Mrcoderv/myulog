name: Build and Package Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-and-package:
    name: Build and Upload Artifacts
    runs-on: ubuntu-latest
    
    permissions:
      contents: read  # Minimal permissions (read-only access)
    
    steps:
      # Fetch full git history for SOURCE_DATE_EPOCH (reproducible timestamps)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git log timestamp
      
      # Enable Docker Buildx for multi-stage builds with --output flag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Display build context for debugging and transparency
      - name: Display build context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          echo "Git log (for SOURCE_DATE_EPOCH):"
          git log -1 --format="%H %ai"
      
      # Build all artifacts using Docker multi-stage builds
      # Produces: wheel, CLI bundle, Lambda ZIP, and SHA256SUMS
      - name: Build artifacts
        run: ./scripts/build.sh
      
      # Validate that checksums match the built artifacts
      - name: Verify checksums
        run: ./scripts/verify_checksums.sh
      
      # Display what was built for transparency in logs
      - name: Display artifacts
        run: |
          echo "=== Generated Artifacts ==="
          ls -lh dist/
          echo ""
          echo "=== SHA256SUMS ==="
          cat dist/SHA256SUMS
      
      # Upload artifacts to GitHub (downloadable from workflow run)
      # Naming: ulog-artifacts-<commit-sha> for uniqueness and traceability
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulog-artifacts-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  verify-reproducibility:
    name: Verify Build Reproducibility
    runs-on: ubuntu-latest
    needs: build-and-package  # Only run after successful build
    
    permissions:
      contents: read  # Minimal permissions (read-only access)
    
    steps:
      # Fetch full git history for SOURCE_DATE_EPOCH
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for reproducible timestamps
      
      # Enable Docker Buildx for multi-stage builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Run reproducibility test: build twice, compare checksums
      # This proves that the same source produces identical artifacts
      - name: Verify reproducible builds
        run: ./scripts/verify_reproducible_build.sh
      
      # Display final checksums for transparency
      - name: Display verified checksums
        run: |
          echo "=== Verified Reproducible Checksums ==="
          cat dist/SHA256SUMS

