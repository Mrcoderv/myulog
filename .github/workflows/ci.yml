---
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        types: [opened, reopened, ready_for_review, review_requested]

# Prevent redundant runs on the same branch/PR
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install pipx & Poetry
              run: |
                python -m pip install --upgrade pip
                python -m pip install pipx
                pipx install poetry
                poetry --version

            - name: Configure Poetry to use in-project venv (for caching)
              run: poetry config virtualenvs.in-project true

            - name: Cache Poetry virtualenv
              id: cache-venv
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
                  restore-keys: |
                    venv-${{ runner.os }}-${{ matrix.python-version }}-

            - name: Install dependencies (incl. dev)
              run: poetry install --with dev --no-interaction --no-ansi

            # --- Lint ---

            - name: Ruff lint
              run: poetry run ruff check .

            - name: YAML lint (4-space indentation on this workflow)
              run: |
                pipx install yamllint
                yamllint .github/workflows/ci.yml


            # --- Tests + Coverage ---

            - name: Unit tests + coverage (XML + badge)
              run: |
                mkdir -p docs
                poetry run pytest --cov=src --cov-report=term-missing --cov-report=xml
                poetry run python -m pip install --disable-pip-version-check -q coverage-badge
                poetry run python -m coverage_badge -o docs/coverage.svg -f

            - name: Upload coverage.xml and badge
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-artifacts
                  path: |
                    coverage.xml
                    docs/coverage.svg

            # --- Schema harness ---

            - name: Run schema test harness (via Make)
              run: mkdir -p tests/reports && make test.schemas | tee tests/reports/schema_console.txt

            - name: Upload schema test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: schema-test-results
                  path: tests/reports/

            - name: Upload schema console log
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: schema-test-console
                  path: tests/reports/schema_console.txt

            # --- Rules / Vocabulary / Common refs ---

            - name: Validate rules.json against rules.schema.json
              run: make rules.validate

            - name: Run vocab linter
              id: vocab_lint
              run: poetry run python tests/vocab/lint_vocab.py

            - name: Suggest fix if vocabulary formatting fails
              if: ${{ steps.vocab_lint.outcome == 'failure' }}
              shell: bash
              run: |
                echo "Run: make format-vocab && make lint-vocab"


            - name: Rules order lint
              run: poetry run pytest -q tests/rules/lint_rules_order.py

            - name: Lint _common.json refs vs vocabulary
              run: poetry run python tests/schemas/lint_common_refs.py

            # --- Round-trip test ---

            - name: Run round-trip test (synthetic raw ↔ normalized)
              run: make test.roundtrip

            - name: Generate baseline dataset (seed=42, 50/domain)
              run: |
                make data.generate.baseline

            - name: Validate baseline dataset (round-trip counts + label alignment)
              run: |
                make data.validate.baseline

            - name: Upload baseline dataset artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: baseline-dataset
                  path: |
                    data/synthetic/raw/*_baseline_raw.jsonl
                    data/synthetic/baseline/*_baseline_parsed.jsonl
                    data/synthetic/baseline_labels.jsonl

            # --- Unit tests for rules & provenance ---

            - name: Run unit tests for rules and provenance
              run: |
                mkdir -p tests/reports
                poetry run pytest tests/unit/ -v --tb=short \
                  --junit-xml=tests/reports/rules_unit_results.xml \
                  --json-report --json-report-file=tests/reports/rules_unit_results.json \
                  --json-report-indent=2

            - name: Upload rules unit test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: rules-unit-test-results
                  path: tests/reports/rules_unit_results.*

            # --- Determinism test ---

            - name: Run golden set determinism test
              run: make test.determinism.golden

    export-requirements:
        runs-on: ubuntu-latest
        needs: [lint-and-test]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Poetry
              run: pipx install poetry

            - name: Enable `poetry export`
              run: pipx inject poetry poetry-plugin-export

            - name: Export pinned requirements.txt
              run: poetry export -f requirements.txt -o requirements.txt --without-hashes

            - name: Upload requirements.txt
              uses: actions/upload-artifact@v4
              with:
                  name: requirements
                  path: requirements.txt
