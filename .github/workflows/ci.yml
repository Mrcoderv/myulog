name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install poetry

      - name: Install deps with Poetry (incl. dev)
        run: |
          poetry --version
          poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Run tests
        run: poetry run pytest -q

      - name: Run schema test harness (via Make)
        run: make test.schemas | tee tests/reports/schema_console.txt

      - name: Upload schema test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-test-results
          path: tests/reports/

      - name: Upload schema console log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-test-console
          path: tests/reports/schema_console.txt
