name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install poetry

      - name: Install deps with Poetry (incl. dev)
        run: |
          poetry --version
          poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Run tests
        run: poetry run pytest -q

      - name: Install jsonschema for schema validation
        run: poetry run pip install jsonschema

      - name: Run schema test harness
        run: poetry run python3 tests/harness/run_harness.py --format junit --output tests/reports/schema_results.xml

      - name: Upload schema test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-test-results-${{ matrix.python-version }}
          path: tests/reports/schema_results.xml
