[project]
name = "ulog"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Eunice Koid", email = "koid.ernli@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.25.1,<5.0.0",
    "click>=8.1.0,<9.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "mangum>=0.17.0,<1.0.0",
    "referencing (>=0.30.0,<0.31.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
ruff = "^0.14.0"
mypy = "^1.18.2"
types-jsonschema = "^4.25.1.20250822"
genbadge = {version = "^1.1.2", extras = ["coverage"]}
mangum = ">=0.17"
httpx = ">=0.27"
fastapi = ">=0.115,<1.0"
pydantic = ">=2.7"
uvicorn = ">=0.30"

[tool.poetry.scripts]
ulog = "ulog.cli:cli"
classify = "ulog.classifier.cli:classify"
