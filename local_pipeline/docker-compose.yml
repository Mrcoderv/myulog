---
services:
    classifier:
        build: ./classifier
        env_file: ../.env
        volumes:
            - ./in:/in
            - ./out:/out

    classifier-http:
        build:
            context: ./classifier
            dockerfile: Dockerfile.http
        env_file: ../.env
        ports:
            - "${PORT:-8080}:8080"
        volumes:
            - ./in:/in
            - ./out:/out
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
            interval: 60s
            timeout: 3s
            retries: 3
            start_period: 10s
