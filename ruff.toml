# ruff.toml (top-level keys only)
line-length = 100
target-version = "py310"   # good for 3.10–3.12 matrix
src = ["src", "tests"]     # tell Ruff where your code lives

[lint]
# E: pycodestyle, F: pyflakes, I: isort(import organization)
select = ["E", "F", "I"]

[lint.isort]
# Mark 'ulog' as first-party so import grouping is correct
known-first-party = ["ulog"]
force-sort-within-sections = true

# OPTIONAL: if you ever want to relax imports in tests only, uncomment:
# [lint.per-file-ignores]
# "tests/*" = ["I001"]
